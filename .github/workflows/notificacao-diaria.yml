name: Lembrete diário de revisão

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC = 08:00 em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions
    inputs:
      dry_run:
        description: "Só simular (não envia e-mails)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notificar:
    runs-on: ubuntu-latest # já vem com Node instalado: sem setup-node, sem npm
    steps:
      - uses: actions/checkout@v4

      - name: Enviar lembretes
        run: node scripts/notificacao-diaria.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
