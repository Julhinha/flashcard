<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas Bibliotecas | IFlashcard - IFRJ</title>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 (CDN fallback + estrutura para /Dependencias/bootstrap.min.css) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Design System IFRJ -->
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="bibliotecas.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <script
      src="../../js/layout.js"
      data-componente="navbar"
      data-pagina="bibliotecas"
    ></script>

    <!-- Toast Container para Feedbacks   -->
    <div
      class="toast-container position-fixed bottom-0 end-0 p-3"
      id="toastContainer"
    ></div>

    <main class="container py-4 flex-grow-1">
      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
      >
        <div>
          <h1 class="h3 fw-bold mb-1">Minhas Bibliotecas & Flashcards</h1>
          <p class="text-muted mb-0">
            Gerencie suas coleções de estudo e crie seus próprios cartões
            manuais.
          </p>
        </div>
        <div class="d-flex gap-2">
          <button
            class="btn btn-outline-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalBiblioteca"
            onclick="abrirModalNovaBiblioteca()"
          >
            <i class="bi bi-folder-plus me-1"></i> Nova Biblioteca
          </button>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalFlashcard"
            onclick="abrirModalNovoCard()"
          >
            <i class="bi bi-plus-lg me-1"></i> Novo Flashcard
          </button>
        </div>
      </div>

      <div class="row g-4">
        <!-- Coluna Esquerda: Lista de Bibliotecas -->
        <div class="col-12 col-lg-4">
          <div class="card p-3">
            <div
              class="d-flex justify-content-between align-items-center mb-3 px-1"
            >
              <span class="fw-bold small text-uppercase text-muted"
                >Coleções Salvas</span
              >
              <span
                class="badge bg-light text-dark border"
                id="contadorBibliotecas"
                >0</span
              >
            </div>
            <div class="d-flex flex-column gap-2" id="listaBibliotecas">
              <!-- Renderizado via bibliotecas.js -->
              <div class="text-center py-4 text-muted small">
                Carregando bibliotecas...
              </div>
            </div>
          </div>
        </div>

        <!-- Coluna Direita: Flashcards da Biblioteca Selecionada -->
        <div class="col-12 col-lg-8">
          <div class="card p-4">
            <div
              class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 pb-3 mb-3 border-bottom"
            >
              <div>
                <h2 class="h5 fw-bold mb-1" id="tituloBibliotecaAtual">
                  Carregando...
                </h2>
                <p class="small text-muted mb-0" id="descBibliotecaAtual"></p>
              </div>
              <div class="d-flex gap-2">
                <a
                  href="../revisao/revisao.html"
                  id="btnRevisarBaralho"
                  class="btn btn-sm btn-primary acao-biblioteca"
                >
                  <i class="bi bi-play-fill me-1"></i> Revisar Baralho
                </a>
                <button
                  class="btn btn-sm btn-outline-secondary acao-biblioteca"
                  onclick="editarBibliotecaAtual()"
                  title="Editar Biblioteca"
                >
                  <i class="bi bi-pencil"></i>
                </button>
                <button
                  class="btn btn-sm btn-outline-danger acao-biblioteca"
                  onclick="excluirBibliotecaAtual()"
                  title="Excluir Biblioteca"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <!-- Lista de Cards -->
            <div class="d-flex flex-column gap-3" id="listaCardsBiblioteca">
              <!-- Renderizado via bibliotecas.js -->
            </div>
            <nav id="paginacaoCards" aria-label="Paginação dos flashcards"></nav>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal CRUD Biblioteca (Create / Update) -->
    <div class="modal fade" id="modalBiblioteca" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <form
          class="modal-content border-0 shadow rounded-4"
          onsubmit="salvarBiblioteca(event)"
        >
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalBibliotecaTitulo">
              Nova Biblioteca
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editBibliotecaId" />
            <div class="mb-3">
              <label class="form-label small fw-semibold"
                >Nome da Biblioteca</label
              >
              <input
                type="text"
                class="form-control"
                id="inputBibliotecaNome"
                placeholder="Ex: Web II"
                required
              />
            </div>
            <div class="mb-0">
              <label class="form-label small fw-semibold">Descrição</label>
              <textarea
                class="form-control"
                id="inputBibliotecaDesc"
                rows="2"
                placeholder="Resumo dos temas abordados..."
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light border"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">
              Salvar Biblioteca
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal CRUD Flashcard (Create / Update) -->
    <div class="modal fade" id="modalFlashcard" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <form
          class="modal-content border-0 shadow rounded-4"
          onsubmit="salvarFlashcard(event)"
        >
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalFlashcardTitulo">
              Novo Flashcard Manual
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editCardId" />
            <div class="mb-3" id="grupoCardBiblioteca">
              <label class="form-label small fw-semibold">Biblioteca</label>
              <div id="dropdownCardBiblioteca"></div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold"
                >Frente (Pergunta ou Conceito)</label
              >
              <textarea
                class="form-control"
                id="inputCardFrente"
                rows="3"
                placeholder="Digite a pergunta..."
                required
              ></textarea>
            </div>
            <div class="mb-0">
              <label class="form-label small fw-semibold"
                >Verso (Resposta)</label
              >
              <textarea
                class="form-control"
                id="inputCardVerso"
                rows="3"
                placeholder="Digite a resposta..."
                required
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light border"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">
              Salvar Flashcard
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div class="modal fade" id="modalConfirmarExclusao" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="confirmarExclusaoTitulo">
              Confirmar exclusão
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="d-flex align-items-start gap-3">
              <div
                class="kpi-icon d-flex align-items-center justify-content-center bg-danger-subtle text-danger flex-shrink-0"
              >
                <i class="bi bi-trash-fill"></i>
              </div>
              <p class="mb-0" id="confirmarExclusaoTexto"></p>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-light border"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="btnConfirmarExclusao"
            >
              <i class="bi bi-trash me-1"></i> Excluir
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../js/layout.js" data-componente="rodape"></script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../env.local.js"></script>
    <script src="../../js/email-template.js"></script>
    <script src="../../js/email-ui.js"></script>
    <script type="module" src="../../js/auth-guard.js"></script>

    <script type="module" src="bibliotecas.js"></script>
  </body>
</html>
