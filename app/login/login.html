<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema | TI Flashcards - IFRJ</title>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 (CDN fallback + estrutura para /Dependencias/bootstrap.min.css) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Design System IFRJ -->
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="bg-light">
  <main class="container d-flex align-items-center justify-content-center py-5 min-vh-100">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-md-8 col-lg-5">
        
        <!-- Cabeçalho com Logo IFRJ -->
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-white p-3 rounded-4 shadow-sm border mb-3">
            <svg width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="13" cy="9" r="4" fill="#CD191E" />
              <rect x="19" y="14" width="16" height="20" rx="3" fill="#1E6B2B" opacity="0.75" transform="rotate(8 27 24)" />
              <rect x="9" y="14" width="18" height="22" rx="3" fill="#2F9E41" />
              <rect x="13" y="20" width="10" height="2" rx="1" fill="#FFFFFF" />
              <rect x="13" y="25" width="6" height="2" rx="1" fill="#FFFFFF" opacity="0.85" />
            </svg>
          </div>
          <h1 class="h3 fw-bold mb-1">TI <span class="text-primary">Flashcards</span></h1>
          <p class="text-muted small mb-0">Plataforma de Repetição Espaçada para TI • <strong>IFRJ</strong></p>
        </div>

        <div class="card p-4">
          <!-- Alerta de Feedback   -->
          <div id="authAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

          <!-- Login Social OAuth 2.0 -->
          <div class="d-grid gap-2 mb-3">
            <button type="button" id="btnGoogle" class="btn btn-social-google fw-semibold py-2 d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-google text-danger"></i>
              <span>Entrar com Google</span>
            </button>
          </div>

          <div class="position-relative my-3 text-center">
            <hr class="text-muted">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">ou use seu e-mail</span>
          </div>

          <!-- Abas Bootstrap: Entrar / Criar Conta -->
          <ul class="nav nav-pills nav-fill bg-light p-1 rounded-3 mb-3" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active py-1" id="tab-login" data-bs-toggle="pill" data-bs-target="#pane-login" type="button" role="tab">Entrar</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="tab-cadastro" data-bs-toggle="pill" data-bs-target="#pane-cadastro" type="button" role="tab">Criar Conta</button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Aba Login Tradicional -->
            <div class="tab-pane fade show active" id="pane-login" role="tabpanel">
              <form id="formLogin">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">E-mail Institucional ou Pessoal</label>
                  <input type="email" id="loginEmail" class="form-control" placeholder="estudante@ifrj.edu.br" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Senha</label>
                  <input type="password" id="loginSenha" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2" id="btnSubmitLogin">
                  <span class="btn-text">Acessar Plataforma</span>
                  <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                </button>
              </form>
            </div>

            <!-- Aba Cadastro Manual -->
            <div class="tab-pane fade" id="pane-cadastro" role="tabpanel">
              <form id="formCadastro">
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Nome Completo</label>
                  <input type="text" id="cadastroNome" class="form-control" placeholder="Ex: João Silva" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">E-mail</label>
                  <input type="email" id="cadastroEmail" class="form-control" placeholder="joao@gmail.com" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-semibold">Criar Senha (mín. 6 caracteres)</label>
                  <input type="password" id="cadastroSenha" class="form-control" minlength="6" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2" id="btnSubmitCadastro">
                  <span class="btn-text">Criar Conta e Entrar</span>
                  <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                </button>
              </form>
            </div>
          </div>
        </div>

        <p class="text-center text-muted small mt-3">
          <i class="bi bi-shield-check text-primary me-1"></i> Autenticação segura via Firebase Auth
        </p>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle (necessário para as abas Entrar / Criar Conta) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
